# XcodeGen spec. CI runs `xcodegen generate` to produce NoiseDiary.xcodeproj,
# so no .xcodeproj is checked in (and none has to be made on a Mac).
# MARKETING_VERSION is set by app-factory release; Apple picks build numbers.
name: NoiseDiary
options:
  bundleIdPrefix: net.leatham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R53MF3F498
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only: a portrait-only app that also targets iPad is rejected on upload.
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NoiseDiary:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Noise Diary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Standard HTTPS only: skips the per-build "Missing Compliance" question.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Noise Diary records a short clip of the noise when you tap Record, so your diary has evidence. Clips stay on your iPhone.
        NSFaceIDUsageDescription: Noise Diary can use Face ID to keep your diary private.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.leatham.noisediary
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
